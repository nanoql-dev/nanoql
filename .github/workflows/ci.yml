#
# The gates of docs/porting-playbook.md §8 on GitHub's runners.
#
# Pushes to main and pull requests run the jobs, as the weekly schedule and a dispatch do. Windows x64 is the
# reference: on the other systems a build, test or vector red is reported but doesn't fail the run. A push or a pull
# request builds and tests on Windows x64, Linux x64 and macOS, and its bindings jobs build Windows x64 and Linux x64;
# the weekly run builds and tests on Windows x64 alone and builds the bindings on all five platforms, so a shipped
# platform's drift shows before a release; a dispatch asks for the systems (Windows x64, or all five with Windows Arm64
# and Linux Arm64) and the bindings platforms (core, macOS alone, or all five).
#
# A release runs it too: release.yml calls it (workflow_call) with every system and every platform (all), in release
# mode.
# The jobs read the call's inputs, not the event's name, since a called workflow's github context is its caller's.
# In release mode the bindings jobs build with ContinuousIntegrationBuild, so the native library's and the add-in's
# symbols record nanoql's sources under /_/, deterministic paths Source Link maps to the commit on GitHub, and they keep
# the native symbols archive and the add-in's symbols zip;
# every artifact a release takes is kept 7 days, not 1; and a leg the call names best-effort runs without stopping it,
# its checks' outcomes kept for the release's notes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:
    inputs:
      systems:
        description: "Systems for the build, tests and vectors: windows or all"
        type: string
        default: windows
      bindings:
        description: "Bindings platforms: core, macos or all"
        type: string
        default: core
      release:
        description: "Release mode: the release's builds, its symbols kept, its artifacts kept 7 days"
        type: boolean
        default: false
      best-effort:
        description: "Bindings legs, by runtime identifier, whose red checks don't stop the call, space-separated"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      reproduce:
        description: "Also rerun the vector generators (builds QuantLib for the C++ harness when it isn't cached)"
        type: boolean
        default: false
      generators:
        description: "Generators to rerun, space-separated (for example time/date cxx/); empty reruns all of them"
        type: string
        default: ""
      systems:
        description: "Systems for the build, tests and vectors: Windows x64 alone, or all five"
        type: choice
        options: [windows, all]
        default: windows
      pin-dotnet:
        description: "Use global.json's SDK exactly, alone in its own folder, with the runtime it ships, not the runner's newer one"
        type: boolean
        default: false
      bindings:
        description: "Bindings platforms: core (Windows x64, Linux x64), macos (macOS Arm64 alone) or all five"
        type: choice
        options: [core, macos, all]
        default: core

permissions:
  contents: read

# Keyed by the workflow too: called by release.yml, github.workflow is the caller's, so a release's dry run on main
# doesn't wait behind main's own run.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  QUANTLIB_TAG: v1.44
  QUANTLIB_COMMIT: ab4cb476d35f7275834bc05b47d1324403d1823b
  QLNET_TAG: QLNet-v1.13.2
  QLNET_COMMIT: 571d01e9ae72feb32f3ee4c4eeff184fa432c5b4

jobs:
  build-test:
    name: Build, tests and vectors (${{ matrix.os }})
    if: inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'all' && '["windows-2022", "windows-11-arm", "ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]' || (github.event_name == 'push' || github.event_name == 'pull_request') && '["windows-2022", "ubuntu-24.04", "macos-15"]' || '["windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-2022' }}
    timeout-minutes: 90
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # global.json lets the SDK roll forward to a newer feature band, which the runners carry; pinned, the SDK it names
      # is installed alone, so the tests run on the runtime that SDK ships.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !inputs.pin-dotnet }}
        with:
          global-json-file: global.json
      - name: global.json's SDK
        if: ${{ inputs.pin-dotnet }}
        id: sdk
        shell: bash
        run: echo "version=$(python -c "import json; print(json.load(open('global.json'))['sdk']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ inputs.pin-dotnet }}
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      # setup-dotnet also installs the newest runtime beside the SDK, and an application runs on the newest patch it
      # finds, so pinned, every Microsoft.NETCore.App but the SDK's own is removed.
      - name: Only the runtime global.json's SDK ships
        if: ${{ inputs.pin-dotnet }}
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          base="$RUNNER_TEMP"; command -v cygpath > /dev/null && base="$(cygpath -u "$RUNNER_TEMP")"
          root="$base/dotnet"
          runtime=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['runtimeOptions']['framework']['version'])" "$root/sdk/$SDK_VERSION/dotnet.runtimeconfig.json")
          echo "SDK $SDK_VERSION ships runtime $runtime"
          for d in "$root"/shared/Microsoft.NETCore.App/*/; do
            [ "$(basename "$d")" = "$runtime" ] || { echo "removing $d"; rm -rf "$d"; }
          done
      # The last bits of some results depend on the processor and on the C runtime that .NET's maths functions call
      # (docs/porting-playbook.md §7.3), so each run names them; on Arm64 Linux, whose /proc/cpuinfo names no model,
      # lscpu does.
      - name: The machine
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name; $os = Get-CimInstance Win32_OperatingSystem; "$($os.Caption) build $($os.BuildNumber)"; "ucrtbase.dll " + (Get-Item C:\Windows\System32\ucrtbase.dll).VersionInfo.FileVersion' ;;
            Linux)
              grep -m1 'model name' /proc/cpuinfo || lscpu | grep -m1 'Model name' || true
              grep PRETTY_NAME /etc/os-release; ldd --version | sed -n 1p ;;
            macOS)
              sysctl -n machdep.cpu.brand_string; sw_vers ;;
          esac
      - name: The .NET in use
        run: |
          dotnet --version
          dotnet --list-runtimes
      - name: Build
        run: dotnet build NanoQL.slnx -c Release --no-incremental
      # The run's own output kept, which a release's notes count each system's failures from.
      - name: Tests
        shell: bash
        env:
          NANOQL_BITID_DIR: ${{ github.workspace }}/TestResults/bitid
          SUMMARY: tests-${{ matrix.os }}.txt
        run: |
          set -o pipefail
          dotnet test --solution NanoQL.slnx -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/$SUMMARY"
      - name: Keep the tests' output, for a release's notes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: ${{ runner.temp }}/tests-${{ matrix.os }}.txt
          if-no-files-found: ignore
          retention-days: ${{ inputs.release && 7 || 1 }}
      - name: Vectors
        run: |
          python -I tools/vectors/count.py
          python -I tools/vectors/agree.py
      - name: Keep the bit-identical tallies, to compare systems
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitid-${{ matrix.os }}
          path: TestResults/bitid
          if-no-files-found: ignore

  # Java's jextract layer: jextract 22, checked against its published SHA-256, run once over nanoql.h and over the test
  # build's nqlt.h, which nanoql-bind headers writes without a native build. The headers hold fixed-width types only, so
  # every bindings job compiles this one layer.
  java-ffi:
    name: Java's jextract layer
    if: inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JEXTRACT_URL: https://download.java.net/java/early_access/jextract/22/6/openjdk-22-jextract+6-47_linux-x64_bin.tar.gz
      JEXTRACT_SHA256: a6a42d5b5f4bff119455daadd1ccec9389b2554aea3342f391577843769cc7ec
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: The headers
        run: |
          dotnet build src/NanoQL.Bind -c Release
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- headers --out "$RUNNER_TEMP/headers" --test-exports
      - name: jextract 22, checked
        run: |
          curl -sSfL -o "$RUNNER_TEMP/jextract.tar.gz" "$JEXTRACT_URL"
          echo "$JEXTRACT_SHA256  $RUNNER_TEMP/jextract.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/jextract.tar.gz" -C "$RUNNER_TEMP"
      - name: The layers
        run: python3 bindings/java/stage.py --jextract "$RUNNER_TEMP/jextract-22/bin/jextract" --headers "$RUNNER_TEMP/headers" --layers "$RUNNER_TEMP/java-ffi"
      - name: Keep the layers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-java-ffi
          path: ${{ runner.temp }}/java-ffi
          retention-days: 1

  # The bindings (docs/bindings.md): the C ABI built with Native AOT on each platform, its checked-in surface checked,
  # the C conformance suite on the test build, and the vector suite recorded and replayed through the C ABI. The weekly
  # run, a dispatch's all and a release build the five platforms; a push, a pull request and a dispatch's core build
  # Windows x64 and Linux x64; a dispatch's macos builds macOS Arm64 alone. Linux builds in a manylinux_2_28 container,
  # so the library runs on glibc 2.28 and
  # later; the container has no libicu, which the library doesn't load. A check's red doesn't stop the checks after
  # it, so a run shows every language's results, and the job's last step reds the job.
  bindings:
    name: Bindings (${{ matrix.rid }})
    needs: java-ffi
    # Not skipped when the java-ffi job fails: C's, C++'s and Python's checks run, and Java's steps are skipped.
    if: ${{ !cancelled() && (inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !github.event.repository.private) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.bindings == 'all') && '[{"rid":"win-x64","os":"windows-2022","container":""},{"rid":"win-arm64","os":"windows-11-arm","container":""},{"rid":"linux-x64","os":"ubuntu-24.04","container":"quay.io/pypa/manylinux_2_28_x86_64"},{"rid":"linux-arm64","os":"ubuntu-24.04-arm","container":"quay.io/pypa/manylinux_2_28_aarch64"},{"rid":"osx-arm64","os":"macos-15","container":""}]' || inputs.bindings == 'macos' && '[{"rid":"osx-arm64","os":"macos-15","container":""}]' || '[{"rid":"win-x64","os":"windows-2022","container":""},{"rid":"linux-x64","os":"ubuntu-24.04","container":"quay.io/pypa/manylinux_2_28_x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    # A leg the call names best-effort reds without stopping it; its outcomes go to the release's notes.
    continue-on-error: ${{ contains(format(' {0} ', inputs.best-effort), format(' {0} ', matrix.rid)) }}
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      # In release mode every build is the release's (Directory.Build.props): the tool built so before its native
      # build, which would otherwise rebuild the running tool.
      ContinuousIntegrationBuild: ${{ inputs.release && 'true' || '' }}
      # The SDK runs without ICU in the Linux container, as the library does.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ matrix.container != '' && '1' || '' }}
      # Every leg's replays compare each double with C#'s on the same machine by its bits, as the reference leg's do;
      # a margin, relative or else absolute, which the replayers tally, is a local run's to set.
      NANOQL_REPLAY_TOLERANCE: "0"
      NANOQL_REPLAY_ABS_TOLERANCE: "0"
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.container == ''
        with:
          global-json-file: global.json
      # In the container: Native AOT's toolchain (clang, zlib), CMake, and the SDK global.json names.
      - name: The toolchain and the SDK in the manylinux container
        if: matrix.container != ''
        run: |
          # Not quiet, so the log shows each download and its speed: one mirror took 44 minutes.
          dnf install -y clang zlib-devel cmake
          sdk=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' global.json | head -1)
          curl -sSfL -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$sdk" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: The machine
        run: |
          # sed -n 1p, not head -1: head's early exit ends AlmaLinux 8's ldd with SIGPIPE, a red under pipefail.
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_OperatingSystem).Caption' ;;
            Linux) grep -m1 'model name' /proc/cpuinfo || true; grep PRETTY_NAME /etc/os-release; ldd --version | sed -n 1p ;;
            macOS) sysctl -n machdep.cpu.brand_string; sw_vers ;;
          esac
          dotnet --version
          cmake --version | sed -n 1p
      - name: The tool
        run: dotnet build src/NanoQL.Bind -c Release
      - name: The checked-in surface (nanoql.h, surface.json, coverage.md)
        id: surface
        continue-on-error: true
        run: dotnet run --project src/NanoQL.Bind -c Release --no-build -- check
      # On the reference leg: every class QuantLib-Python constructs crosses, has a route or an exclusion with its
      # reason, the wheel installed as the vector jobs install it, so an API change that loses a route, or a pin that
      # adds a class, reds.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.rid == 'win-x64'
        with:
          python-version: "3.12"
      - name: Parity with QuantLib-Python
        id: parity
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/venv-parity"
          py="$RUNNER_TEMP/venv-parity/Scripts/python.exe"
          "$py" -m pip install -q --require-hashes --only-binary :all: -r tools/vectors/build-requirements.txt
          "$py" -m pip install -q --require-hashes --no-build-isolation -r tools/vectors/requirements.txt
          wheel=$("$py" -c "import os, QuantLib; print(os.path.join(os.path.dirname(QuantLib.__file__), 'QuantLib.py'))")
          "$py" -I tools/bindings/wheelparity.py "$wheel" bindings/surface.json bindings/wheel-routes.json --fail-on-gap
      - name: The native library
        run: |
          start=$(date +%s)
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- build --rid "$RID" --out "$RUNNER_TEMP/nanoql"
          echo "the native build took $(( $(date +%s) - start )) s"
          ls -l "$RUNNER_TEMP/nanoql/lib"
          # The name a program linked to the library records: Linux's soname and macOS's install name.
          case "$RUNNER_OS" in
            Linux)
              readelf -d "$RUNNER_TEMP/nanoql/lib/libnanoql.so" > "$RUNNER_TEMP/dynamic.txt"
              grep -F '(SONAME)' "$RUNNER_TEMP/dynamic.txt" | grep -F '[libnanoql.so]' ;;
            macOS)
              otool -D "$RUNNER_TEMP/nanoql/lib/libnanoql.dylib" > "$RUNNER_TEMP/install-name.txt"
              grep -Fx '@rpath/libnanoql.dylib' "$RUNNER_TEMP/install-name.txt" ;;
          esac
      - name: The test build
        run: dotnet run --project src/NanoQL.Bind -c Release --no-build -- build --rid "$RID" --out "$RUNNER_TEMP/nanoql-test" --test-exports
      - name: No libicu in the container
        id: no-libicu
        if: matrix.container != ''
        continue-on-error: true
        run: |
          if ldconfig -p | grep -q libicu; then echo "::error::libicu is present, so the suite wouldn't show the library runs without it"; exit 1; fi
      - name: The C conformance suite
        id: c-conformance
        continue-on-error: true
        run: |
          cmake -S bindings/c/tests -B "$RUNNER_TEMP/c-tests" -DNANOQL_DIR="$RUNNER_TEMP/nanoql-test" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/c-tests" --config Release
          ctest --test-dir "$RUNNER_TEMP/c-tests" -C Release --output-on-failure
      # The trace stays in the job's temporary folder, never uploaded.
      - name: The vector suite, recorded
        run: |
          dotnet build tests/NanoQL.Tests -c Release
          dotnet build tools/replay -c Release
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- twins --out "$RUNNER_TEMP/twins"
          # Windows x64 is the reference, as in build-test: elsewhere a vector red is reported and the trace kept, since
          # the replays compare each binding with C#'s own results on the same machine.
          keep=$([ "$RID" = win-x64 ] || echo --keep-reds)
          dotnet tools/replay/bin/Release/net10.0/NanoQL.Replay.dll record --tests tests/NanoQL.Tests/bin/Release/net10.0 \
            --twins "$RUNNER_TEMP/twins" --out "$RUNNER_TEMP/recording" $keep
      - name: The vector suite, replayed in C
        id: c-replay
        continue-on-error: true
        run: |
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- replay-c --out "$RUNNER_TEMP/c-dispatch"
          cmake -S bindings/c/replay -B "$RUNNER_TEMP/c-replay" -DNANOQL_DIR="$RUNNER_TEMP/nanoql" -DNANOQL_DISPATCH="$RUNNER_TEMP/c-dispatch" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/c-replay" --config Release
          replay=$(find "$RUNNER_TEMP/c-replay" -name 'replay' -type f -o -name 'replay.exe' -type f | head -1)
          "$replay" "$RUNNER_TEMP/recording/trace.jsonl" "$RUNNER_TEMP/recording/facts.tsv" bindings/replay-floor.json
      # Excel, on the reference leg alone: the Windows-only solution built and tested after the native build, whose
      # managed NanoQL.Native.dll the error table's test reads; the checked-in surface; the shipped builds, packed
      # against the runtime package; the tests' builds, compiled with no .xll; the vector suite's trace replayed through
      # the experimental tests' build's worksheet functions, and the repro vectors replayed through them in each order;
      # and the release's package, kept a day, its symbols zip only at a release. The suite inside Excel needs Excel,
      # which the runners don't have: it runs on a contributor's machine (CONTRIBUTING.md).
      - name: The Excel add-in
        id: excel
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        run: |
          dotnet build bindings/excel/NanoQL.Excel.slnx -c Release
          dotnet test --project bindings/excel/NanoQL.Excel.Tests -c Release --no-build
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- excel check
          dotnet pack src/NanoQL.Excel -c Release --no-build -o "$RUNNER_TEMP/excel-feed"
          bind="dotnet run --project src/NanoQL.Bind -c Release --no-build -- excel build"
          $bind --runtime-source "$RUNNER_TEMP/excel-feed" --out "$RUNNER_TEMP/excel-stable"
          $bind --runtime-source "$RUNNER_TEMP/excel-feed" --out "$RUNNER_TEMP/excel-experimental" --experimental
          $bind --list nql=none --no-pack --runtime-source "$RUNNER_TEMP/excel-feed" --out "$RUNNER_TEMP/excel-tests-stable"
          $bind --list nql=none --no-pack --runtime-source "$RUNNER_TEMP/excel-feed" --out "$RUNNER_TEMP/excel-tests-experimental" --experimental
          dotnet run --project bindings/excel/replay -c Release --no-build -- "$RUNNER_TEMP/recording/trace.jsonl" \
            "$RUNNER_TEMP/excel-tests-experimental" --floor bindings/excel/replay-floor.json
          for order in "" --reverse; do
            dotnet run --project bindings/excel/replay -c Release --no-build -- vectors bindings/excel/tests/repro \
              "$RUNNER_TEMP/excel-tests-experimental" $order
          done
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- excel package --runtime-source "$RUNNER_TEMP/excel-feed" \
            --out "$RUNNER_TEMP/excel-package"
      - name: Keep the Excel package
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-excel-win-x64
          path: ${{ runner.temp }}/excel-package/nanoql-excel-*-win-x64.zip
          retention-days: ${{ inputs.release && 7 || 1 }}
      - name: Keep the Excel package's symbols, at a release
        if: matrix.rid == 'win-x64' && inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-excel-symbols-win-x64
          path: ${{ runner.temp }}/excel-package/nanoql-excel-*-win-x64-symbols.zip
          retention-days: 7
      # C++: nanoql.hpp, C++17, through its conformance suite on the test build and the vector suite's trace, which
      # replays to C's facts line for line.
      - name: The C++ conformance suite
        id: cpp-conformance
        continue-on-error: true
        run: |
          cmake -S bindings/cpp/tests -B "$RUNNER_TEMP/cpp-tests" -DNANOQL_DIR="$RUNNER_TEMP/nanoql-test" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/cpp-tests" --config Release
          ctest --test-dir "$RUNNER_TEMP/cpp-tests" -C Release --output-on-failure
      - name: The vector suite, replayed in C++
        id: cpp-replay
        continue-on-error: true
        run: |
          dotnet run --project src/NanoQL.Bind -c Release --no-build -- replay-cpp --out "$RUNNER_TEMP/cpp-dispatch"
          cmake -S bindings/cpp/replay -B "$RUNNER_TEMP/cpp-replay" -DNANOQL_DIR="$RUNNER_TEMP/nanoql" -DNANOQL_DISPATCH="$RUNNER_TEMP/cpp-dispatch" -DCMAKE_BUILD_TYPE=Release
          # Two jobs: a dispatch unit takes g++ over a gigabyte, and make given no count compiles all 18 at once, more
          # than a private repository's Linux runner holds.
          cmake --build "$RUNNER_TEMP/cpp-replay" --config Release --parallel 2
          replay=$(find "$RUNNER_TEMP/cpp-replay" -name 'replay' -type f -o -name 'replay.exe' -type f | head -1)
          "$replay" "$RUNNER_TEMP/recording/trace.jsonl" "$RUNNER_TEMP/recording/cpp-facts.tsv"
          diff <(sort "$RUNNER_TEMP/recording/facts.tsv") <(sort "$RUNNER_TEMP/recording/cpp-facts.tsv")
      # Python: CPython's oldest supported version with NumPy's floor, and the newest with the newest NumPy. The
      # manylinux container brings its own CPythons. NumPy's first Windows Arm64 wheels are 2.3's, so that platform's
      # floor is 2.3.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python-floor
        if: matrix.container == ''
        with:
          python-version: "3.11"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python-newest
        if: matrix.container == ''
        with:
          python-version: "3.x"
      - name: The Python wheel, its conformance suite and the vector suite replayed through it
        id: python
        continue-on-error: true
        env:
          FLOOR: ${{ steps.python-floor.outputs.python-path }}
          NEWEST: ${{ steps.python-newest.outputs.python-path }}
        run: |
          if [ -d /opt/python ]; then
            FLOOR=/opt/python/cp311-cp311/bin/python
            NEWEST=$(ls -d /opt/python/cp3*-cp3*/bin/python | grep -v 't-cp' | sort -V | tail -1)
          fi
          "$NEWEST" bindings/python/build.py --library "$RUNNER_TEMP/nanoql" --rid "$RID" --out "$RUNNER_TEMP/wheels"
          "$NEWEST" bindings/python/build.py --library "$RUNNER_TEMP/nanoql-test" --rid "$RID" --stage "$RUNNER_TEMP/python-test" --test-exports
          floor_numpy=$([ "$RID" = win-arm64 ] && echo "numpy==2.3.*" || echo "numpy==1.26.*")
          for run in "floor|$FLOOR|$floor_numpy" "newest|$NEWEST|numpy"; do
            IFS='|' read -r label interpreter numpy <<< "$run"
            [ -n "$interpreter" ] || { echo "no $label Python here"; continue; }
            "$interpreter" -m venv "$RUNNER_TEMP/venv-$label"
            py="$RUNNER_TEMP/venv-$label/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv-$label/Scripts/python.exe"
            "$py" -m pip install -q --only-binary :all: "$numpy"
            "$py" -m pip install -q --no-index --find-links "$RUNNER_TEMP/wheels" nanoql
            echo "== $label: $("$py" --version), NumPy $("$py" -c 'import numpy; print(numpy.__version__)')"
            (cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/bindings/python/tests/wheel_check.py" "$GITHUB_WORKSPACE/bindings/python/pyproject.toml")
            PYTHONPATH="$RUNNER_TEMP/python-test" "$py" -m unittest discover -s bindings/python/tests -v
          done
          # On Windows x64 the replay also calls once each function the suite doesn't, its outcomes in the runner's
          # temp folder.
          sweep=$([ "$RID" != win-x64 ] || echo --sweep "$RUNNER_TEMP/sweep-outcomes.tsv")
          (cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/bindings/python/tests/replay.py" "$RUNNER_TEMP/recording/trace.jsonl" $sweep)
      - name: Keep the Python wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-python-${{ matrix.rid }}
          path: ${{ runner.temp }}/wheels/*.whl
          retention-days: ${{ inputs.release && 7 || 1 }}
      # The C archive: the headers, the library, its CMake package and the notices, zipped on Windows, .tar.xz
      # elsewhere.
      - name: The C archive
        id: archive
        continue-on-error: true
        run: |
          py=$(command -v python3 || command -v python)
          if [ -d /opt/python ]; then py=$(ls -d /opt/python/cp3*-cp3*/bin/python | grep -v 't-cp' | sort -V | tail -1); fi
          "$py" bindings/c/archive.py --library "$RUNNER_TEMP/nanoql" --rid "$RID" --out "$RUNNER_TEMP/archive"
          "$py" bindings/c/tests/archive_check.py "$(ls "$RUNNER_TEMP"/archive/nanoql-*-c-api.*)"
      - name: Keep the C archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-c-api-${{ matrix.rid }}
          path: ${{ runner.temp }}/archive/nanoql-*-c-api.*
          retention-days: ${{ inputs.release && 7 || 1 }}
      # A user's C++ project through the archive's CMake package, the archive unpacked as a user unpacks it: built and
      # run with the leg's compilers, MSVC on Windows, g++ and clang elsewhere.
      - name: A user's C++ project through the archive's package
        id: cpp-package
        continue-on-error: true
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          archive=$(ls "$RUNNER_TEMP"/archive/nanoql-*-c-api.*)
          (cd "$unpacked" && cmake -E tar xf "$archive")
          prefix=$(ls -d "$unpacked"/nanoql-*-c-api)
          compilers=default
          [ "${{ runner.os }}" = Windows ] || compilers="g++ clang++"
          for cxx in $compilers; do
            build="$RUNNER_TEMP/cpp-package-$cxx"
            chosen=()
            [ "$cxx" = default ] || chosen=(-DCMAKE_CXX_COMPILER="$cxx")
            cmake -S bindings/cpp/consumer -B "$build" -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_BUILD_TYPE=Release "${chosen[@]}"
            cmake --build "$build" --config Release
            ctest --test-dir "$build" -C Release --output-on-failure
          done
      # At a release, the native library's symbols beside the C archive, in its form.
      - name: The native symbols archive, at a release
        id: symbols
        if: inputs.release
        continue-on-error: true
        run: |
          py=$(command -v python3 || command -v python)
          if [ -d /opt/python ]; then py=$(ls -d /opt/python/cp3*-cp3*/bin/python | grep -v 't-cp' | sort -V | tail -1); fi
          "$py" tools/release/symbols.py --library "$RUNNER_TEMP/nanoql" --rid "$RID" --out "$RUNNER_TEMP/symbols"
      - name: Keep the native symbols archive, at a release
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-symbols-${{ matrix.rid }}
          path: ${{ runner.temp }}/symbols/nanoql-*-symbols.*
          retention-days: 7
      # Java: the java-ffi job's layers, the idiomatic layer over nanoql's compiled for Java 22 on the newest LTS JDK,
      # under -Xcheck:jni on Linux and macOS, which fails the step where it reports a signal handler Native AOT's
      # runtime replaced; the conformance suite on the test build, the test types a user's package beside nanoql's; the
      # vector suite replayed at or above B4's floor (Java's enums hold no undefined value and a double[][] no 0-by-n
      # matrix, so a few refusals' facts stop short of C's); and the jars with their notices.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.java-ffi.result == 'success'
        with:
          name: nanoql-java-ffi
          path: ${{ runner.temp }}/java-ffi
      # Temurin 25, but Microsoft's build on Windows Arm64, which Temurin 25 has none for.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: needs.java-ffi.result == 'success'
        with:
          distribution: ${{ matrix.rid == 'win-arm64' && 'microsoft' || 'temurin' }}
          java-version: "25"
      - name: Maven 3.9.9, checked
        if: needs.java-ffi.result == 'success'
        env:
          MAVEN_URL: https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
          MAVEN_SHA512: a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b
        run: |
          curl -sSfL -o "$RUNNER_TEMP/maven.tar.gz" "$MAVEN_URL"
          # The archive on stdin: given a name holding a backslash (Windows' RUNNER_TEMP), sha512sum escapes the line.
          sum=$( (sha512sum < "$RUNNER_TEMP/maven.tar.gz" 2>/dev/null || shasum -a 512 < "$RUNNER_TEMP/maven.tar.gz") | cut -d' ' -f1)
          [ "$sum" = "$MAVEN_SHA512" ] || { echo "::error::Maven's archive doesn't match its SHA-512"; exit 1; }
          # From the folder itself: GNU tar reads a Windows path's colon as a remote host and unquotes its backslashes.
          (cd "$RUNNER_TEMP" && tar -xzf maven.tar.gz)
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: The Java layer, its conformance suite and the vector suite replayed through it
        id: java
        if: needs.java-ffi.result == 'success'
        continue-on-error: true
        run: |
          py=$(command -v python3 || command -v python)
          if [ -d /opt/python ]; then py=$(ls -d /opt/python/cp3*-cp3*/bin/python | grep -v 't-cp' | sort -V | tail -1); fi
          case "$RUNNER_OS" in Windows) lib=nanoql.dll; sep=';' ;; macOS) lib=libnanoql.dylib; sep=':' ;; *) lib=libnanoql.so; sep=':' ;; esac
          jvm=""; [ "$RUNNER_OS" = Windows ] || jvm="-Xcheck:jni"
          # The JDK's libjsig preloaded on Linux and macOS, so the library's SIGSEGV and SIGFPE handlers chain behind
          # the JVM's. Each JVM runs through a java that sets the variable itself: Surefire starts its JVM through
          # /bin/sh, which strips DYLD_* on macOS (SIP). Surefire takes a java in a bin folder, the JDK's release file
          # in the folder above.
          java=java; surefire=""
          if [ "$RUNNER_OS" != Windows ]; then
            jsig="$JAVA_HOME/lib/libjsig.so"; [ "$RUNNER_OS" = macOS ] && jsig="$JAVA_HOME/lib/libjsig.dylib"
            [ -f "$jsig" ] || { echo "::error::no libjsig at $jsig"; exit 1; }
            jdk="$RUNNER_TEMP/jsig-jdk"; mkdir -p "$jdk/bin"; cp "$JAVA_HOME/release" "$jdk/release"
            printf '#!/bin/sh\nexport LD_PRELOAD="%s" DYLD_INSERT_LIBRARIES="%s"\nexec "%s/bin/java" "$@"\n' "$jsig" "$jsig" "$JAVA_HOME" > "$jdk/bin/java"
            chmod +x "$jdk/bin/java"; java="$jdk/bin/java"; surefire="-Djvm=$java"
          fi
          "$java" -version
          "$py" bindings/java/stage.py --library "$RUNNER_TEMP/nanoql-test" --ffi "$RUNNER_TEMP/java-ffi" --rid "$RID" --test-exports --dispatch
          (cd bindings/java && mvn -B -ntp -Dnanoql.library="$RUNNER_TEMP/nanoql-test/lib/$lib" -Dnanoql.jvmArgs="$jvm" $surefire test) 2>&1 | tee "$RUNNER_TEMP/java.log"
          "$java" --enable-native-access=ALL-UNNAMED $jvm -Dnanoql.library="$RUNNER_TEMP/nanoql-test/lib/$lib" \
            -cp "bindings/java/target/classes${sep}bindings/java/target/test-classes" org.nanoql.replay.Replay \
            "$RUNNER_TEMP/recording/trace.jsonl" "$RUNNER_TEMP/recording/java-facts.tsv" bindings/replay-floor.json 2>&1 | tee -a "$RUNNER_TEMP/java.log"
          # -Xcheck:jni warns, and goes on, where a signal handler the JVM installed was replaced; a forked suite's JVM
          # writes it to surefire's dump stream. The files that exist alone, so a missing one can't hide a match.
          shopt -s nullglob
          logs=("$RUNNER_TEMP/java.log" bindings/java/target/surefire-reports/*.dumpstream)
          if grep -i "handler modified" "${logs[@]}"; then
            echo "::error::-Xcheck:jni reports a replaced signal handler with libjsig preloaded"; exit 1
          fi
      - name: The Java jars
        id: java-jars
        if: needs.java-ffi.result == 'success'
        continue-on-error: true
        run: |
          py=$(command -v python3 || command -v python)
          if [ -d /opt/python ]; then py=$(ls -d /opt/python/cp3*-cp3*/bin/python | grep -v 't-cp' | sort -V | tail -1); fi
          classifier=$("$py" bindings/java/stage.py --library "$RUNNER_TEMP/nanoql" --ffi "$RUNNER_TEMP/java-ffi" --rid "$RID" | tail -1)
          (cd bindings/java && mvn -B -ntp -Dmaven.test.skip=true -Dnanoql.classifier="$classifier" package)
          "$py" bindings/java/jar_check.py bindings/java/target "$classifier"
      - name: Keep the Java jars
        if: needs.java-ffi.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoql-java-${{ matrix.rid }}
          path: bindings/java/target/nanoql-*.jar
          retention-days: ${{ inputs.release && 7 || 1 }}
      # On macOS a process that dies of a signal, a replay's, a suite's or a JVM's, leaves a crash report, which
      # ReportCrash writes some seconds after it dies: each one since the checkout is printed, the library's frames
      # named from the builds' symbols, with any JVM's fatal-error log; after a red check the step waits up to a
      # minute for a report still being written.
      - name: Crash reports, on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          RED: ${{ contains(steps.*.outcome, 'failure') }}
        run: |
          wait=$([ "$RED" = true ] && echo 60 || echo 0)
          python3 -I tools/bindings/crash_reports.py --since global.json --wait "$wait" --jvm-logs . --jvm-logs bindings/java \
            --symbols "$RUNNER_TEMP/nanoql/publish/libnanoql.dylib.dSYM" \
            --symbols "$RUNNER_TEMP/nanoql-test/publish/libnanoql.dylib.dSYM"
      # The checks above go on past a red; the job reds here, after them all, first writing their outcomes, which a
      # release's notes read for a best-effort leg.
      - name: Every check green
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            surface:${{ steps.surface.outcome }}
            parity:${{ steps.parity.outcome }}
            no-libicu:${{ steps.no-libicu.outcome }}
            c-conformance:${{ steps.c-conformance.outcome }}
            c-replay:${{ steps.c-replay.outcome }}
            excel:${{ steps.excel.outcome }}
            cpp-conformance:${{ steps.cpp-conformance.outcome }}
            cpp-replay:${{ steps.cpp-replay.outcome }}
            python:${{ steps.python.outcome }}
            archive:${{ steps.archive.outcome }}
            cpp-package:${{ steps.cpp-package.outcome }}
            symbols:${{ steps.symbols.outcome }}
            java:${{ steps.java.outcome }}
            java-jars:${{ steps.java-jars.outcome }}
        run: |
          printf '%s\n' $OUTCOMES > "$RUNNER_TEMP/bindings-outcomes-$RID.txt"
          reds=""
          for step in $OUTCOMES; do
            echo "$step"
            case "$step" in *:failure) reds="$reds ${step%:failure}" ;; esac
          done
          [ -z "$reds" ] || { echo "::error::red:$reds"; exit 1; }
      - name: Keep the checks' outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-outcomes-${{ matrix.rid }}
          path: ${{ runner.temp }}/bindings-outcomes-${{ matrix.rid }}.txt
          if-no-files-found: ignore
          retention-days: ${{ inputs.release && 7 || 1 }}

  licensing:
    name: Licensing
    if: inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The licensing tools, hash-pinned
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tools/vectors/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r tools/vectors/requirements.txt
      - name: QuantLib at the pin
        run: |
          git clone --quiet --depth 1 --branch "$QUANTLIB_TAG" https://github.com/lballabio/QuantLib.git "$RUNNER_TEMP/QuantLib"
          test "$(git -C "$RUNNER_TEMP/QuantLib" rev-parse HEAD)" = "$QUANTLIB_COMMIT"
      - name: Boost's release zip, cached
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/boost-zip
          key: boost-zip-${{ hashFiles('tools/cxx/build.py') }}
      - name: Boost's headers, checked against the published SHA-256
        run: |
          url=$(sed -n 's/^BOOST_URL = "\(.*\)"$/\1/p' tools/cxx/build.py)
          sha=$(sed -n 's/^BOOST_SHA256 = "\(.*\)"$/\1/p' tools/cxx/build.py)
          mkdir -p "$RUNNER_TEMP/boost-zip"
          cd "$RUNNER_TEMP/boost-zip"
          [ -f boost.zip ] || curl -sSfL -o boost.zip "$url"
          echo "$sha  boost.zip" | sha256sum -c -
          python -I - boost.zip "$RUNNER_TEMP/boost" <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              keep = [n for n in z.namelist() if n.split("/")[1:2] == ["boost"] or n.count("/") == 1]
              z.extractall(sys.argv[2], keep)
          EOF
      # The extensions' QLNet ports name QLNet's files at its release tag, checked by its commit and a clean status.
      - name: QLNet at the pin
        run: |
          git clone --quiet --depth 1 --branch "$QLNET_TAG" https://github.com/amaggiulli/QLNet.git "$RUNNER_TEMP/QLNet"
          test "$(git -C "$RUNNER_TEMP/QLNet" rev-parse HEAD)" = "$QLNET_COMMIT"
      - name: reuse lint
        run: reuse lint
      - name: Upstream lines, copyright lines and notices
        run: >
          python -I tools/check-upstream.py "$RUNNER_TEMP/QuantLib" --boost "$RUNNER_TEMP/boost/boost_1_90_0"
          --qlnet "$RUNNER_TEMP/QLNet"

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The check reads the commit's changes as the working tree against HEAD, so HEAD moves to the base and the
      # working tree keeps the pull request merged into it.
      - name: The pull request's changes against its base
        id: changes
        run: |
          git reset --soft HEAD^1
          if git diff --quiet HEAD -- src/; then echo "src=false" >> "$GITHUB_OUTPUT"; else echo "src=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.changes.outputs.src == 'true'
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.src == 'true'
        with:
          python-version: "3.12"
      - name: Build
        if: steps.changes.outputs.src == 'true'
        run: dotnet build NanoQL.slnx -c Release --no-incremental
      # Every tagged class, a superset of the commit's own: the check passes or fails on the same types. One run per
      # oracle: QuantLib's, and QLNet's for the extensions' QLNet ports, each type passing on its own oracle's run.
      - name: The tagged tests under coverage
        if: steps.changes.outputs.src == 'true'
        run: >
          dotnet test --solution NanoQL.slnx -c Release --no-build --filter-trait "Oracle=QuantLib" --coverage
          --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings tests/NanoQL.Tests/CodeCoverage.xml --results-directory TestResults/coverage
      - name: The QLNet-tagged tests under coverage
        if: steps.changes.outputs.src == 'true'
        run: >
          dotnet test --solution NanoQL.slnx -c Release --no-build --filter-trait "Oracle=QLNet" --coverage
          --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings tests/NanoQL.Tests/CodeCoverage.xml --results-directory TestResults/coverage-qlnet
      - name: The ported types' coverage
        if: steps.changes.outputs.src == 'true'
        run: python -I tools/check-coverage.py TestResults/coverage --qlnet TestResults/coverage-qlnet

  reproducibility:
    name: Vector reproducibility
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.reproduce) ||
      (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CXX_ROOT: ${{ github.workspace }}/../cxx
    steps:
      - name: Check out with LF line endings, as the working clones are
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Which generators rerun (docs/porting-playbook.md §8): those the change adds or changes; all of them when a
      # shared helper or a requirements file changes; every harness generator when the harness, its client or any wheel
      # generator changes, a superset of the harness generators that import it; every QLNet generator when QLNet's
      # vector program changes. A QLNet shim needs the .NET SDK, not the harness.
      - name: The generators to rerun
        id: which
        env:
          GENERATORS: ${{ inputs.generators }}
        run: |
          all=0; harness=0; gens=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$GENERATORS" ]; then all=1; else read -ra gens <<< "$GENERATORS"; fi
          else
            while IFS= read -r f; do
              case "$f" in
                tools/vectors/gen/*.py)
                  g="${f#tools/vectors/gen/}"; gens+=("${g%.py}")
                  case "$g" in cxx/*|qlnet/*) ;; *) harness=1 ;; esac ;;
                tools/vectors/gen/*) g="${f#tools/vectors/gen/}"; gens+=("${g%/*}/") ;;
                tools/vectors/qlnet/*) gens+=("qlnet/") ;;
                tools/vectors/cxx.py|tools/cxx/*) harness=1 ;;
                tools/vectors/*.py|tools/vectors/*requirements.txt) all=1 ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          [ "$harness" = 1 ] && gens+=("cxx/")
          [ ${#gens[@]} -gt 0 ] && mapfile -t gens < <(printf '%s\n' "${gens[@]}" | sort -u)
          args=""; [ "$all" = 0 ] && args="${gens[*]}"
          run=false; { [ "$all" = 1 ] || [ ${#gens[@]} -gt 0 ]; } && run=true
          cxx=false; { [ "$all" = 1 ] || [[ " ${gens[*]} " == *" cxx/"* ]]; } && cxx=true
          qlnet=false; { [ "$all" = 1 ] || [[ " ${gens[*]} " == *" qlnet/"* ]]; } && qlnet=true
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "cxx=$cxx" >> "$GITHUB_OUTPUT"; echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "qlnet=$qlnet" >> "$GITHUB_OUTPUT"
          echo "rerun: ${args:-every generator} (run $run, harness $cxx, QLNet $qlnet)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.which.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: The generators' oracle, hash-pinned
        if: steps.which.outputs.run == 'true'
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tools/vectors/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r tools/vectors/requirements.txt
      - name: QuantLib at the pin
        if: steps.which.outputs.cxx == 'true'
        run: |
          git clone --quiet --depth 1 --branch "$QUANTLIB_TAG" https://github.com/lballabio/QuantLib.git "$RUNNER_TEMP/QuantLib"
          test "$(git -C "$RUNNER_TEMP/QuantLib" rev-parse HEAD)" = "$QUANTLIB_COMMIT"
      # tools/cxx/build.py rebuilds QuantLib when its configure command or the toolchain differ from the stamp.
      - name: QuantLib's build for the harness, cached
        if: steps.which.outputs.cxx == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CXX_ROOT }}/downloads
            ${{ env.CXX_ROOT }}/quantlib-install
            ${{ env.CXX_ROOT }}/quantlib-build/nanoql-stamp.json
          key: cxx-${{ runner.os }}-${{ hashFiles('tools/cxx/build.py') }}
      - name: The C++ harness
        if: steps.which.outputs.cxx == 'true'
        run: |
          python -I tools/cxx/build.py "$CXX_ROOT" --quantlib "$RUNNER_TEMP/QuantLib"
          echo "NANOQL_HARNESS=$(cygpath -w "$CXX_ROOT/harness-build/cxx-harness.exe")" >> "$GITHUB_ENV"
      - name: The harness's self-test
        if: steps.which.outputs.cxx == 'true'
        run: python -I tools/vectors/cxx.py --self-test
      # QLNet's shims build tools/vectors/qlnet/ on the SDK global.json names, its QLNet package locked by its
      # packages.lock.json.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.which.outputs.qlnet == 'true'
        with:
          global-json-file: global.json
      - name: Rerun the generators
        if: steps.which.outputs.run == 'true'
        env:
          GENERATORS: ${{ steps.which.outputs.args }}
        run: python -I tools/vectors/reproduce.py $GENERATORS

  dco:
    name: Sign-off
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Every commit of the pull request carries a Signed-off-by line naming its author (CONTRIBUTING.md).
      - name: Every commit signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author' line"
              fail=1
            fi
          done
          exit "$fail"
