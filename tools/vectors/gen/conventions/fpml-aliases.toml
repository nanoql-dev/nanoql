#
# FpML's codes that nanoql takes as aliases of its own names, read by tools/vectors/gen/conventions/aliases.py,
# which writes src/NanoQL.Extensions/Conventions/Presets/aliases.xml. The codes are FpML's, under the FpML Public
# License (LICENSES/LicenseRef-FpML-Public-License-3.0.txt); the mapping of each code to a nanoql name is nanoql's
# own work. A code gets an alias only where it maps exactly: FpML's NEAREST adjusts a holiday to the preceding
# business day unless it falls on a Sunday or a Monday, which QuantLib's Nearest doesn't; 30E/360.ISDA keeps
# the last day of February when it is the termination date, which a day counter preset doesn't know, so
# Thirty360.German counts 180 days where the convention counts 178 on a final period to the end of February; and
# a business centre that is a city's banking days has none. Each scheme's codes are as fpml.org publishes them
# at the version given, so each alias's code is checked verbatim against its scheme's list.

[schemes.day-count-fraction]
version = "2-3"
uri = "http://www.fpml.org/coding-scheme/day-count-fraction-2-3"
codes = [
  "1/1", "30/360", "30E/360", "30E/360.ISDA", "ACT/360", "ACT/365.FIXED", "ACT/365L", "ACT/ACT.AFB", "ACT/ACT.ICMA",
  "ACT/ACT.ISDA", "ACT/ACT.ISMA", "BUS/252", "RBA"
]

