version = 1

# Files without a comment header.
[[annotations]]
path = [
  "README.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", ".github/pull_request_template.md", "NOTICE",
  ".gitattributes", ".gitignore", "NanoQL.slnx", "Directory.Build.props",
  ".editorconfig", "global.json", "stylecop.json", "tools/porting-map.json", "tests/vectors/**",
  "tools/vectors/qlnet/packages.lock.json", "bindings/surface.json", "bindings/roles.json", "bindings/NanoQL.Bindings.slnx",
  "bindings/NanoQL.Bind.Tests/Fixtures/shipped.json", "bindings/python/nanoql/py.typed", "bindings/replay-floor.json",
  "bindings/wheel-routes.json", "bindings/excel/functions.json", "bindings/excel/list.json", "bindings/excel/replay-floor.json",
  "bindings/excel/NanoQL.Excel.slnx", "bindings/excel/xltests/global.json", "bindings/excel/README.md",
  "bindings/excel/tests/repro/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The nanoql Authors"
SPDX-License-Identifier = "Apache-2.0"

# QuantLib's license file, verbatim; its copyright lines are read from the file itself.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "aggregate"
SPDX-License-Identifier = "BSD-3-Clause"

# Excel-DNA's and .NET's license texts, which the Excel package appends to the notices; their copyright lines are
# read from the files themselves.
[[annotations]]
path = "bindings/excel/notices/Excel-DNA.txt"
precedence = "aggregate"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "bindings/excel/notices/dotnet.txt"
precedence = "aggregate"
SPDX-License-Identifier = "MIT"

# QuantLib's table of primitive polynomials modulo two, generated from primitivepolynomials.cpp by
# tools/tables/primitivepolynomials.py: data only, under Jäckel's notice as QuantLib distributes it.
[[annotations]]
path = "src/NanoQL/Numerics/RandomNumbers/PrimitivePolynomials.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2002 Peter Jäckel \"Monte Carlo Methods in Finance\"."
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-Jaeckel"

# QuantLib's node table for its exponentially fitted Gauss-Laguerre Heston engine, generated from
# exponentialfittinghestonengine.cpp by tools/tables/exponentialfittinghestonengine.py: data only.
[[annotations]]
path = "src/NanoQL/PricingEngines/Vanilla/ExponentialFittingHestonEngine/ExponentialFittingHestonEngineValues.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2020 Klaus Spanderen"
SPDX-License-Identifier = "BSD-3-Clause"

# QuantLib's tables for its Sobol generator, generated from sobolrsg.cpp by tools/tables/sobolrsg.py: data only,
# among them the Joe-Kuo and Kuo direction numbers under their licence.
[[annotations]]
path = "src/NanoQL/Numerics/RandomNumbers/SobolRsg/*.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright (C) 2003, 2004 Ferdinando Ametrano", "Copyright (C) 2006 Richard Gould", "Copyright (C) 2007 Mark Joshi",
  "Copyright (C) 2013 Cheng Li", "Copyright (c) 2008, Frances Y. Kuo and Stephen Joe",
]
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-JoeKuo"

# QuantLib's lattice rules' generating vectors (Cools, Kuo and Nuyens), generated from latticerules.cpp by
# tools/tables/latticerules.py: data only.
[[annotations]]
path = "src/NanoQL/Numerics/RandomNumbers/LatticeRules/LatticeRules.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2007 Mark Joshi"
SPDX-License-Identifier = "BSD-3-Clause"

# QuantLib's absorption table for the no-arbitrage SABR model (Doust), generated from noarbsabrabsprobs.cpp by
# tools/tables/noarbsabrabsprobs.py: data only.
[[annotations]]
path = "src/NanoQL/Experimental/Volatility/NoArbSabrAbsProbs.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2014 Peter Caspers"
SPDX-License-Identifier = "BSD-3-Clause"
