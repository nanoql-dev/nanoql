version = 1

# Files without a comment header.
[[annotations]]
path = [
  "README.md", "CONTRIBUTING.md", "NOTICE", ".gitattributes", ".gitignore", "NanoQL.slnx", "Directory.Build.props",
  ".editorconfig", "global.json", "stylecop.json", "tools/porting-map.json", "tests/vectors/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The nanoql Authors"
SPDX-License-Identifier = "Apache-2.0"

# QuantLib's license file, verbatim; its copyright lines are read from the file itself.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "aggregate"
SPDX-License-Identifier = "BSD-3-Clause"

# QuantLib's table of primitive polynomials modulo two, generated from primitivepolynomials.cpp by
# tools/tables/primitivepolynomials.py: data only, under Jäckel's notice as QuantLib distributes it.
[[annotations]]
path = "src/NanoQL/Numerics/RandomNumbers/PrimitivePolynomials.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2002 Peter Jäckel \"Monte Carlo Methods in Finance\"."
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-Jaeckel"

# QuantLib's node table for its exponentially fitted Gauss-Laguerre Heston engine, generated from
# exponentialfittinghestonengine.cpp by tools/tables/exponentialfittinghestonengine.py: data only.
[[annotations]]
path = "src/NanoQL/PricingEngines/Vanilla/ExponentialFittingHestonEngine/ExponentialFittingHestonEngineValues.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2020 Klaus Spanderen"
SPDX-License-Identifier = "BSD-3-Clause"

# QuantLib's tables for its Sobol generator, generated from sobolrsg.cpp by tools/tables/sobolrsg.py: data only,
# among them the Joe-Kuo and Kuo direction numbers under their licence.
[[annotations]]
path = "src/NanoQL/Numerics/RandomNumbers/SobolRsg/*.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright (C) 2003, 2004 Ferdinando Ametrano", "Copyright (C) 2006 Richard Gould", "Copyright (C) 2007 Mark Joshi",
  "Copyright (C) 2013 Cheng Li", "Copyright (c) 2008, Frances Y. Kuo and Stephen Joe",
]
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-JoeKuo"
